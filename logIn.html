<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Project Leo|| Log in page</title>

</head>
<body>
    <div class="page-shell justify-content-center">
        <main class="container py-5">
            <div class="login-panel rounded-4 shadow-lg p-4 p-md-5 mx-auto">
                <div class="text-center mb-4">
                    <a class="navbar-brand fw-bold text-decoration-none text-white" href="index.html"><span class="brand-mark">✦</span> Leo2</a>
                    <h1 class="h3 mt-4 mb-2">Welcome back</h1>
                    <p class="text-white-50 mb-0">Log in to continue exploring.</p>
                </div>
                <form action="" id="userData">
                    <div class="mb-3"><label class="form-label" for="userName">Username</label><input class="form-control form-control-lg" type="text" name="username" id="userName" placeholder="Enter username" required></div>
                    <div class="mb-3"><label class="form-label" for="userEmail">Email</label><input class="form-control form-control-lg" type="email" name="email" id="userEmail" placeholder="you@example.com" required></div>
                    <div class="mb-4"><label class="form-label" for="userPassword">Password</label><input class="form-control form-control-lg" type="password" name="password" id="userPassword" placeholder="Enter password" required></div>
                    <button class="btn btn-leo btn-lg w-100" type="submit">Log in</button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-white-50">Just browsing?</span>
                    <a class="link-info text-decoration-none" href="index.html">Continue as guest</a>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
